name: Publicar funções do Supabase

# Publica as Edge Functions (supabase/functions/*) sempre que alguma delas
# muda na main, sem precisar fazer isso à mão no painel do Supabase.
# Usa o secret SUPABASE_FUNCTIONS_TOKEN: um token do Supabase só com a permissão
# "Edge Functions: Read-write" (o do keepalive não tem essa permissão).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: tfedrfuchnqgebnfenuk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_FUNCTIONS_TOKEN (Settings → Secrets and variables → Actions): token do Supabase com 'Edge Functions: Read-write'."
            exit 1
          fi

      - name: Publicar
        run: |
          for dir in supabase/functions/*/; do
            nome=$(basename "$dir")
            echo "Publicando $nome…"
            npx --yes supabase@2.122.1 functions deploy "$nome" --project-ref "$PROJECT_REF" --use-api
          done
