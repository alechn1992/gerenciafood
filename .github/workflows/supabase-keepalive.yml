name: Supabase keepalive

# O projeto Supabase Free pausa após 7 dias sem atividade. Este workflow roda
# a cada 4 horas e:
#   1. Faz uma consulta real ao banco pela API REST (é isso que conta como
#      atividade). A chave anon é pública — vai embutida no site — então,
#      se o secret SUPABASE_ANON_KEY não existir, ela é lida do próprio site
#      publicado. Também chama a função /api/keepalive do Vercel.
#   2. Se nenhuma consulta funcionar, o workflow FALHA (X vermelho no GitHub e
#      e-mail para o dono do repositório) em vez de passar em silêncio — antes
#      ele "passava" mesmo sem conseguir falar com o banco.
#   3. Com o secret SUPABASE_ACCESS_TOKEN configurado, verifica o status do
#      projeto e, se já pausou, restaura automaticamente.
#
# SUPABASE_ACCESS_TOKEN: gere em supabase.com/dashboard/account/tokens e
# cadastre em: repositório → Settings → Secrets and variables → Actions →
# New repository secret.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: tfedrfuchnqgebnfenuk
      SUPABASE_URL: https://tfedrfuchnqgebnfenuk.supabase.co
      SITE_URL: https://gerenciafood.vercel.app
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verificar status e restaurar se pausado
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          resp=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          status=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo '?')
          echo "::notice::Status do projeto Supabase: $status"

          if [ "$status" = "INACTIVE" ] || [ "$status" = "PAUSED" ]; then
            curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d '{}'
            echo "::warning::Projeto estava pausado — restauração disparada. Leva alguns minutos para voltar."
            # Espera o banco subir para que o ping abaixo já conte como atividade.
            for i in $(seq 1 20); do
              sleep 15
              s=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo '?')
              echo "aguardando: $s"
              [ "$s" = "ACTIVE_HEALTHY" ] && break
            done
          elif [ "$status" = "?" ]; then
            echo "::warning::Não foi possível ler o status do projeto. O SUPABASE_ACCESS_TOKEN pode estar inválido ou expirado."
          fi

      - name: Consultar o banco (mantém o projeto ativo)
        run: |
          ok=0

          # Chave anon: do secret ou, na falta dele, do site publicado.
          key="$SUPABASE_ANON_KEY"
          origem="secret"
          if [ -z "$key" ]; then
            origem="site"
            for js in $(curl -sSL -m 30 "$SITE_URL/" | grep -oE '/assets/[^"]+\.js' | sort -u || true); do
              key=$(curl -sSL -m 30 "$SITE_URL$js" | grep -oE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' \
                | while read -r jwt; do
                    payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
                    while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
                    if echo "$payload" | base64 -d 2>/dev/null | grep -q '"role":"anon"'; then echo "$jwt"; break; fi
                  done || true)
              # Projetos novos usam a chave "publishable" no lugar do JWT anon.
              [ -z "$key" ] && key=$(curl -sSL -m 30 "$SITE_URL$js" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -1 || true)
              [ -n "$key" ] && break
            done
            [ -n "$key" ] && echo "chave anon lida do site publicado"
          fi

          if [ -n "$key" ]; then
            code=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/insumos?select=id&limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key" || echo 000)
            echo "::notice::Consulta direta ao banco: HTTP $code (chave do $origem)"
            [ "$code" = "200" ] && ok=1
          else
            echo "::warning::Chave anon não encontrada (nem secret SUPABASE_ANON_KEY, nem no site $SITE_URL)."
          fi

          # Segunda via: a função do Vercel, que usa as variáveis de ambiente de lá.
          resp=$(curl -sS -m 60 "$SITE_URL/api/keepalive" || true)
          echo "::notice::Função /api/keepalive do Vercel: $(echo "$resp" | head -c 200)"
          echo "$resp" | grep -q '"ok":true' && ok=1

          if [ "$ok" = "1" ]; then
            echo "::notice::Banco consultado com sucesso — projeto mantido ativo."
          else
            echo "::error::Nenhuma consulta ao banco funcionou. O projeto pode estar pausado ou a configuração mudou."
            exit 1
          fi

      - name: Aviso se o secret de restauração não está configurado
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — se o projeto pausar, este workflow não consegue restaurá-lo sozinho. Veja o comentário no topo do arquivo."
